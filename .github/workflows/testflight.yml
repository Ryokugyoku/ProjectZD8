name: TestFlight

on:
  workflow_dispatch:
    inputs:
      submit_external_review:
        description: Submit the uploaded builds for external TestFlight review
        required: true
        default: false
        type: boolean

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload the iPhone and iPad app for iOS and Apple silicon Macs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: ProjectZD8.xcodeproj
      SCHEME: ProjectZD8
      ASC_APP_ID: "6794738083"
      ASC_BETA_GROUP_ID: "50b38969-a5d1-4637-baf7-02a223bab2f2"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Validate App Store Connect credentials
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          IOS_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_BASE64 }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_PRIVATE_KEY"
          test -n "$IOS_DEVELOPMENT_CERTIFICATE_BASE64"
          test -n "$IOS_DEVELOPMENT_CERTIFICATE_PASSWORD"

      - name: Install temporary App Store Connect key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          api_key_path="${RUNNER_TEMP}/private_keys/AuthKey_${API_KEY_ID}.p8"
          mkdir -p "$(dirname "$api_key_path")"
          printf '%s' "$API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"

      - name: Install fixed iOS development signing identity
        env:
          IOS_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_BASE64 }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/ProjectZD8-iOS-Development.p12"
          keychain_path="${RUNNER_TEMP}/ProjectZD8-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$IOS_DEVELOPMENT_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_DEVELOPMENT_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T "$(xcrun --find xcodebuild)"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep '170EECC0DE9974138EFE595468182FC68AFF1F7F'

      - name: Archive iPhone and iPad app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/ProjectZD8-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Upload iPhone and iPad app to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/ProjectZD8-iOS.xcarchive" \
            -exportPath "${RUNNER_TEMP}/ProjectZD8-iOS-Export" \
            -exportOptionsPlist .github/ExportOptions-TestFlight.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Publish uploaded builds to the TestFlight beta group
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          ASC_BUILD_NUMBER: ${{ github.run_number }}
          ASC_SUBMIT_EXTERNAL_REVIEW: ${{ inputs.submit_external_review }}
        run: ruby .github/testflight_build_publisher.rb

      - name: Remove temporary signing material
        if: ${{ always() }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          security delete-keychain "${RUNNER_TEMP}/ProjectZD8-signing.keychain-db" || true
          find "${RUNNER_TEMP}/private_keys/AuthKey_${API_KEY_ID}.p8" \
            "${RUNNER_TEMP}/ProjectZD8-iOS-Development.p12" \
            -type f \
            -delete
